packages:
  - apps/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  '@tarojs/binding': true
  '@tarojs/cli': true
  core-js: true
  core-js-pure: true
  esbuild: true
minimumReleaseAgeExclude:
  - lint-staged@17.6.0

# Taro 4.2.1 自带的 Ant Design RN 5.0 仍声明旧版 peer，按官方 RN 0.73 壳固定兼容范围。
peerDependencyRules:
  allowedVersions:
    "@ant-design/react-native@5.0.0>@react-native-picker/picker": "2.6.1"
    "@ant-design/react-native@5.0.0>react-native-gesture-handler": "2.14.1"
    "@react-native-community/cameraroll@4.1.2>react": "18.2.0"
